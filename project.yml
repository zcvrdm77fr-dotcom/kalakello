name: Kalakello
options:
  bundleIdPrefix: fi.kalakello
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: fi
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.1"
    CURRENT_PROJECT_VERSION: "2"
    CODE_SIGN_STYLE: Automatic
    # DEVELOPMENT_TEAM: ABCDE12345   # <- oma Apple Developer Team ID
targets:
  Kalakello:
    type: application
    platform: iOS
    sources:
      - path: Kalakello
    info:
      path: Config/Info.plist
      properties:
        CFBundleDisplayName: Kalakello
        CFBundleDevelopmentRegion: fi
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSLocationWhenInUseUsageDescription: "Kalakello hakee sään ja lähimmät kalapaikat sijaintisi perusteella."
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fi.kalakello.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
  KalakelloTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: KalakelloTests
    dependencies:
      - target: Kalakello
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fi.kalakello.app.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Kalakello:
    build:
      targets:
        Kalakello: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - KalakelloTests
