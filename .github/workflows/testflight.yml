name: Upload to TestFlight

# Vaatii maksullisen Apple Developer -tilin ja 4 salaisuutta (Settings → Secrets and variables → Actions):
#   APPLE_TEAM_ID        10-merkkinen Team ID (developer.apple.com → Membership)
#   ASC_KEY_ID           App Store Connect API -avaimen Key ID
#   ASC_ISSUER_ID        Issuer ID (sama sivu)
#   ASC_KEY_P8_BASE64    .p8-avaimen sisältö base64-koodattuna
# Sovellus pitää olla luotu App Store Connectissa samalla bundle ID:llä kuin project.yml:ssä.
# HUOM: tätä ei ole ajettu läpi – ensimmäinen ajo voi vaatia pieniä säätöjä.
on:
  workflow_dispatch:

jobs:
  testflight:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen and generate the Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Write App Store Connect API key
        run: |
          mkdir -p "$HOME/private_keys"
          echo "${{ secrets.ASC_KEY_P8_BASE64 }}" | base64 --decode > "$HOME/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8"

      - name: Archive (cloud-managed signing)
        run: |
          set -o pipefail
          xcodebuild archive \
            -project Kalakello.xcodeproj \
            -scheme Kalakello \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/Kalakello.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8" \
            -authenticationKeyID "${{ secrets.ASC_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.ASC_ISSUER_ID }}" \
            DEVELOPMENT_TEAM="${{ secrets.APPLE_TEAM_ID }}" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" 2>&1 | tee archive.log

      - name: Export and upload to App Store Connect
        run: |
          cat > ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${{ secrets.APPLE_TEAM_ID }}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          PLIST
          set -o pipefail
          xcodebuild -exportArchive \
            -archivePath build/Kalakello.xcarchive \
            -exportOptionsPlist ExportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8" \
            -authenticationKeyID "${{ secrets.ASC_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.ASC_ISSUER_ID }}" 2>&1 | tee export.log

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testflight-logs
          path: |
            archive.log
            export.log
